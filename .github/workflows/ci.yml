name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Generate wrangler.toml for tests
        run: cp wrangler.toml.example wrangler.toml

      - name: Integration tests
        run: npm run test:integration

  # Required GitHub repository secrets for deploy:
  #   CLOUDFLARE_DEPLOY_TOKEN  — API token with Workers Scripts:Edit, D1:Edit, Workers Routes:Edit, User Memberships:Read
  #   D1_DATABASE_ID           — D1 database ID (from `pulumi stack output databaseId`)
  #   BASE_DOMAIN              — e.g. "drop.example.com"
  #   ADMIN_USERS              — comma-separated admin emails
  #   CF_ACCESS_TEAM           — Cloudflare Access team name
  #   CF_ACCESS_AUD            — Access application audience tag
  #   CLOUDFLARE_ACCOUNT_ID    — Cloudflare account ID
  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate wrangler.toml
        run: cp wrangler.toml.example wrangler.toml && node scripts/ci-wrangler-config.mjs
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          BASE_DOMAIN: ${{ secrets.BASE_DOMAIN }}
          ADMIN_USERS: ${{ secrets.ADMIN_USERS }}
          CF_ACCESS_TEAM: ${{ secrets.CF_ACCESS_TEAM }}
          CF_ACCESS_AUD: ${{ secrets.CF_ACCESS_AUD }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
